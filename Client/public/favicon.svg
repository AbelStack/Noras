<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Exact Noras 3D N Logo -->
  <defs>
    <!-- Gradient definitions matching the 3D logo -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 3D N Structure -->
  <g transform="translate(80, 60)">
    <!-- Left vertical pillar (front face) -->
    <path d="M0 0 L80 0 L80 392 L0 392 Z" fill="url(#grad1)"/>
    
    <!-- Left pillar depth (3D effect) -->
    <path d="M80 0 L100 20 L100 412 L80 392 Z" fill="#1e3a8a" opacity="0.7"/>
    
    <!-- Left pillar top -->
    <path d="M0 0 L80 0 L100 20 L20 20 Z" fill="#60a5fa"/>
    
    <!-- Diagonal connector (front face) -->
    <path d="M80 0 L180 0 L272 392 L172 392 Z" fill="url(#grad2)"/>
    
    <!-- Diagonal depth (3D effect) -->
    <path d="M180 0 L200 20 L292 412 L272 392 Z" fill="#2563eb" opacity="0.8"/>
    
    <!-- Diagonal top -->
    <path d="M80 0 L180 0 L200 20 L100 20 Z" fill="#60a5fa"/>
    
    <!-- Right vertical pillar (front face) -->
    <path d="M272 0 L352 0 L352 392 L272 392 Z" fill="url(#grad3)"/>
    
    <!-- Right pillar depth (3D effect) -->
    <path d="M352 0 L372 20 L372 412 L352 392 Z" fill="#1e40af" opacity="0.6"/>
    
    <!-- Right pillar top -->
    <path d="M272 0 L352 0 L372 20 L292 20 Z" fill="#3b82f6"/>
    
    <!-- Bottom shadows -->
    <path d="M0 392 L80 392 L100 412 L20 412 Z" fill="#1e3a8a" opacity="0.5"/>
    <path d="M272 392 L352 392 L372 412 L292 412 Z" fill="#1e3a8a" opacity="0.5"/>
  </g>
</svg>