  <!-- Stylized "N" lettermark -->
  <g transform="translate(24, 20)">
    <!-- Left vertical bar -->
    <path d="M0 0 L20 0 L20 88 L0 88 Z" fill="#1E3A8A" opacity="0.9"/>
    
    <!-- Diagonal bar -->
    <path d="M20 0 L80 88 L60 88 L0 0 Z" fill="#60A5FA"/>
    
    <!-- Right vertical bar with perspective -->
